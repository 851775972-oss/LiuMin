name: 哔哩哔哩UP主评论监控

on:
  schedule:
    # 调整频率：每 15 分钟运行一次 (防止过于频繁)
    - cron: '*/15 * * * *' 
  workflow_dispatch: # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 运行监控
        env:
          UP_MID: {{ secrets.UP_MID }}
          BARK_KEY: {{ secrets.BARK_KEY }}
        run: |
          node  setTimeout(resolve, delay));
          }
          
          // 发送 Bark 推送
          function push(title, body, url = '') {
            if (!BARK_KEY) {
              console.log('⚠️ 未配置 Bark，跳过推送');
              console.log(标题: {title});
              console.log(内容: {body});
              return Promise.resolve();
            }
            
            const pushUrl = https://api.day.app/{BARK_KEY}/{encodeURIComponent(title)}/{encodeURIComponent(body)}?url={encodeURIComponent(url)};
            
            return new Promise((resolve, reject) => {
              https.get(pushUrl, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  console.log('✅ 推送成功:', data);
                  resolve();
                });
              }).on('error', (err) => {
                console.error('❌ 推送失败:', err.message);
                reject(err);
              });
            });
          }
          
          // HTTP GET 请求 (带重试机制)
          function httpGet(url, retry = 3) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, { headers: HEADERS }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    // 优化 2: 增加状态码检查
                    if (res.statusCode !== 200) {
                      throw new Error(HTTP {res.statusCode});
                    }
                    resolve(JSON.parse(data));
                  } catch(e) {
                    reject(new Error('JSON解析失败: ' + e.message));
                  }
                });
              });
              
              req.on('error', (err) => {
                // 简单的重试逻辑
                if (retry > 0) {
                  console.log(🔄 请求失败，{1000}ms 后重试... ({3-retry+1}));
                  setTimeout(() => httpGet(url, retry - 1).then(resolve).catch(reject), 1000);
                } else {
                  reject(err);
                }
              });
              
              req.setTimeout(10000, () => req.destroy(new Error('请求超时')));
            });
          }
          
          // 获取UP主最新视频
          async function getLatestVideo() {
            // 优化 3: 使用 HTTPS 的 API 地址
            const url = https://api.bilibili.com/x/space/wbi/arc/search?mid={UP_MID}&ps=1&pn=1&order=pubdate;
            const data = await httpGet(url);
            if (data.code !== 0) throw new Error(获取视频失败: {data.message});
            if (!data.data?.list?.vlist?.[0]) throw new Error('未找到视频列表');
            return data.data.list.vlist[0];
          }
          
          // 获取视频评论
          async function getComments(aid) {
            const url = https://api.bilibili.com/x/v2/reply/main?next=1&type=1&oid={aid}&mode=3;
            const data = await httpGet(url);
            if (data.code !== 0) return [];
            return data.data?.replies || [];
          }
          
          // 读取上次记录
          async function loadLastData() {
            try {
              const content = await fs.readFile(DATA_FILE, 'utf8');
              return JSON.parse(content);
            } catch (err) {
              console.log('🆕 未找到历史记录，初始化...');
              return { bvid: '', comments: [] };
            }
          }
          
          // 保存记录
          async function saveData(data) {
            await fs.writeFile(DATA_FILE, JSON.stringify(data, null, 2));
          }
          
          // 主函数
          async function main() {
            const now = new Date().toLocaleString('zh-CN');
            console.log(n🔍 [{now}] 开始监控 UP主: {UP_MID});
            
            try {
              // 1. 获取最新视频
              const video = await getLatestVideo();
              console.log(📹 最新视频: {video.title} ({video.bvid}));
              
              const lastData = await loadLastData();
              const isNewVideo = lastData.bvid !== video.bvid;
              
              // 2. 新视频提醒
              if (isNewVideo) {
                console.log('🆕 发现新视频！');
                await push(
                  '📱 UP主发布新视频',
                  {video.title}n👁 {video.play}  |  💬 {video.comment},
                  https://b23.tv/{video.bvid}
                );
                // 重置评论记录
                lastData.comments = [];
              }
              
              // 3. 获取评论 (增加随机延迟，防止被封)
              console.log('⏳ 正在获取评论...');
              // 优化 4: 获取评论前随机等待 2-5 秒
              await sleep(2000, 5000);
              
              const comments = await getComments(video.aid);
              console.log(💬 获取到 {comments.length} 条评论);
              
              // 4. 筛选UP主当天评论
              const today = new Date();
              today.setHours(0, 0, 0, 0);
              
              const upComments = comments.filter(c => {
                const isUp = c.member?.mid === UP_MID;
                if (!isUp) return false;
                
                const commentDate = new Date(c.ctime * 1000);
                const isToday = commentDate >= today;
                return isToday;
              });
              
              console.log(📝 UP主今日评论: {upComments.length} 条);
              
              // 5. 检查新评论
              const lastCommentIds = new Set(lastData.comments || []);
              const newComments = upComments.filter(c => !lastCommentIds.has(c.rpid_str));
              
              if (newComments.length > 0) {
                console.log(✨ 发现 {newComments.length} 条新评论！);
                
                for (const comment of newComments) {
                  const time = new Date(comment.ctime * 1000).toLocaleString('zh-CN');
                  await push(
                    '💬 UP主新评论',
                    {video.title}nn📝 {comment.content}nn🕐 {time},
                    https://b23.tv/${video.bvid}
                  );
                  
                  // 优化 5: 避免推送过快，随机等待 1-3 秒
                  await sleep(1000, 3000);
                }
              } else {
                console.log('⏸️ 暂无新评论');
              }
              
              // 6. 保存记录
              await saveData({
                bvid: video.bvid,
                comments: upComments.map(c => c.rpid_str), // 使用字符串 ID
                checkTime: now
              });
              
              console.log('✅ 监控完成n');
              
            } catch (err) {
              console.error('❌ 监控失败:', err.message);
              await push('⚠️ 监控异常', err.message);
            }
          }
          
          main();
          EOF
