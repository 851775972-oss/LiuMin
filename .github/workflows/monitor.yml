name: 哔哩哔哩UP主评论监控

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟运行一次
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 运行监控
        env:
          UP_MID: ${{ secrets.UP_MID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs').promises;
          
          // 模拟 iPhone 13 + iOS 26.3.1 + 中国电信5G
          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 26_3_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
            'Referer': 'https://www.bilibili.com',
            'Accept': 'application/json, text/plain, */*',
            'Accept-Language': 'zh-CN,zh-Hans;q=0.9'
          };
          
          const UP_MID = process.env.UP_MID;
          const BARK_KEY = process.env.BARK_KEY;
          
          // 数据存储文件
          const DATA_FILE = './last_video.json';
          
          // 发送 Bark 推送
          function push(title, body, url = '') {
            if (!BARK_KEY) {
              console.log('⚠️ 未配置 Bark，跳过推送');
              console.log(`标题: ${title}`);
              console.log(`内容: ${body}`);
              return Promise.resolve();
            }
            
            const pushUrl = `https://api.day.app/${BARK_KEY}/${encodeURIComponent(title)}/${encodeURIComponent(body)}?url=${encodeURIComponent(url)}`;
            
            return new Promise((resolve, reject) => {
              https.get(pushUrl, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  console.log('✅ 推送成功:', data);
                  resolve();
                });
              }).on('error', (err) => {
                console.error('❌ 推送失败:', err.message);
                reject(err);
              });
            });
          }
          
          // HTTP GET 请求
          function httpGet(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: HEADERS }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch(e) {
                    reject(new Error('JSON解析失败: ' + e.message));
                  }
                });
              }).on('error', reject).setTimeout(10000, () => reject(new Error('超时')));
            });
          }
          
          // 获取UP主最新视频
          async function getLatestVideo() {
            const url = `https://api.bilibili.com/x/space/arc/search?mid=${UP_MID}&ps=1&pn=1&order=pubdate`;
            const data = await httpGet(url);
            if (data.code !== 0) throw new Error(data.message);
            return data.data.list.vlist[0];
          }
          
          // 获取视频评论
          async function getComments(aid) {
            const url = `https://api.bilibili.com/x/v2/reply?type=1&oid=${aid}&pn=1&ps=30&sort=0`;
            const data = await httpGet(url);
            if (data.code !== 0) return [];
            return data.data?.replies || [];
          }
          
          // 读取上次记录
          async function loadLastData() {
            try {
              const content = await fs.readFile(DATA_FILE, 'utf8');
              return JSON.parse(content);
            } catch {
              return { bvid: '', comments: [] };
            }
          }
          
          // 保存记录
          async function saveData(data) {
            await fs.writeFile(DATA_FILE, JSON.stringify(data, null, 2));
          }
          
          // 主函数
          async function main() {
            const now = new Date().toLocaleString('zh-CN');
            console.log(`\n🔍 [${now}] 开始监控 UP主: ${UP_MID}`);
            
            try {
              // 1. 获取最新视频
              const video = await getLatestVideo();
              console.log(`📹 最新视频: ${video.title} (${video.bvid})`);
              
              const lastData = await loadLastData();
              const isNewVideo = lastData.bvid !== video.bvid;
              
              // 2. 新视频提醒
              if (isNewVideo) {
                console.log('🆕 发现新视频！');
                await push(
                  '📱 UP主发布新视频',
                  `${video.title}\n👁 ${video.play}  |  💬 ${video.comment}`,
                  `https://b23.tv/${video.bvid}`
                );
              }
              
              // 3. 获取评论
              const comments = await getComments(video.aid);
              console.log(`💬 获取到 ${comments.length} 条评论`);
              
              // 4. 筛选UP主当天评论
              const today = new Date();
              today.setHours(0, 0, 0, 0);
              
              const upComments = comments.filter(c => {
                const isUp = c.mid === parseInt(UP_MID);
                const commentDate = new Date(c.ctime * 1000);
                const isToday = commentDate >= today;
                return isUp && isToday;
              });
              
              console.log(`📝 UP主今日评论: ${upComments.length} 条`);
              
              // 5. 检查新评论
              const lastCommentIds = new Set(lastData.comments || []);
              const newComments = upComments.filter(c => !lastCommentIds.has(c.rpid));
              
              if (newComments.length > 0) {
                console.log(`✨ 发现 ${newComments.length} 条新评论！`);
                
                for (const comment of newComments) {
                  const time = new Date(comment.ctime * 1000).toLocaleString('zh-CN');
                  await push(
                    '💬 UP主新评论',
                    `${video.title}\n\n${comment.content}\n\n🕐 ${time}`,
                    `https://b23.tv/${video.bvid}`
                  );
                  
                  // 避免推送过快
                  await new Promise(r => setTimeout(r, 1000));
                }
              } else {
                console.log('⏸️ 暂无新评论');
              }
              
              // 6. 保存记录
              await saveData({
                bvid: video.bvid,
                comments: upComments.map(c => c.rpid),
                checkTime: now
              });
              
              console.log('✅ 监控完成\n');
              
            } catch (err) {
              console.error('❌ 监控失败:', err.message);
              await push('⚠️ 监控异常', err.message);
            }
          }
          
          main();
          EOF
